<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>権限エラー — Asterisk PBX Manager</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css?v={{ app_version }}">
</head>
<body>

<main class="login-card" style="max-width:720px;">
  <header class="login-card__head">
    <div class="brand__mark">A</div>
    <div>
      <div class="login-card__title">ファイルに書き込めませんでした</div>
      <div class="login-card__sub">実行ユーザーの権限が不足しています</div>
    </div>
  </header>

  <div class="notice notice--warn">
    <pre style="white-space:pre-wrap;margin:0;">{{ detail }}</pre>
  </div>

  <p class="form-hint">
    「システム」画面の<strong>ファイル権限の診断</strong>で、
    他のディレクトリにも同じ問題が無いかまとめて確認できます。
  </p>

  <p>
    <a class="btn btn--primary" href="/system/#perm-check">ファイル権限の診断を開く</a>
    <a class="btn" href="/" style="margin-left:8px;">ダッシュボードへ戻る</a>
  </p>
</main>

</body>
</html>
