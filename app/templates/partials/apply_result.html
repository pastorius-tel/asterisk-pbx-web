<div class="apply-result__inner">
  {% if error %}
    <div class="notice notice--warn">
      <strong>設定ファイルを書き出せませんでした</strong>
      <pre style="white-space:pre-wrap;margin:0;">{{ error }}</pre>
      <p style="margin-bottom:0;">
        「システム」画面の<a href="/system/#perm-check">ファイル権限の診断</a>で
        他に問題が無いかも確認できます。
      </p>
    </div>
  {% endif %}
  <h3>生成ファイル</h3>
  <ul class="apply-result__files">
    {% for f in written %}
      <li><code>{{ f.path }}</code></li>
    {% endfor %}
  </ul>
  <h3>AMI Reload 結果</h3>
  <ul class="apply-result__reload">
    {% for cmd, result in reload_results.items() %}
      <li>
        <code>{{ cmd }}</code>:
        <span class="{{ 'ok' if result == 'OK' else 'ng' }}">{{ result }}</span>
      </li>
    {% endfor %}
  </ul>
</div>
