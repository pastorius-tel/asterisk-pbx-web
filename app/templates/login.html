<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン — Asterisk PBX Manager</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css?v={{ app_version }}">
</head>
<body class="login-body">

<main class="login-card">
  <header class="login-card__head">
    <div class="brand__mark">A</div>
    <div>
      <div class="login-card__title">Asterisk PBX Manager</div>
      <div class="login-card__sub">管理画面にログイン</div>
    </div>
  </header>

  {% if error %}
    <p class="login-card__error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="/login" class="login-card__form" autocomplete="off">
    <input type="hidden" name="next" value="{{ next }}">

    <label class="field">
      <span class="field__label">ユーザー名</span>
      <input class="field__input" name="username" autocomplete="username"
             autofocus required>
    </label>

    <label class="field">
      <span class="field__label">パスワード</span>
      <input class="field__input" name="password" type="password"
             autocomplete="current-password" required>
    </label>

    <button type="submit" class="btn btn--primary btn--block">ログイン</button>
  </form>

  <p class="login-card__note">
    パスワードは <code>.env</code> の <code>ADMIN_PASSWORD</code> で設定します。
    忘れた場合はサーバー上で <code>.env</code> を編集し、サービスを再起動してください。
  </p>
</main>

</body>
</html>
